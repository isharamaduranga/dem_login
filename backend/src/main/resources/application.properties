spring.application.name=live-auth-demo
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/demo_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
